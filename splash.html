<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MediQ Pharma</title>
<meta name="theme-color" content="#06193d">
<link rel="prefetch" href="index.html">
<noscript><meta http-equiv="refresh" content="0;url=index.html"></noscript>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@200;300;700&display=swap" rel="stylesheet">
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#06193d;font-family:'Plus Jakarta Sans',system-ui,sans-serif;color:#fff}
.splash{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden;
  background:radial-gradient(75% 90% at 50% 48%,#0e3678 0%,#071d47 55%,#030c20 100%);
  clip-path:inset(0 0 0 0);transition:clip-path .88s cubic-bezier(.76,0,.24,1),opacity .55s ease .45s;will-change:clip-path,opacity}
.halo{position:absolute;left:50%;top:50%;width:min(85vw,900px);height:min(30vw,280px);transform:translate3d(-50%,-72%,0);
  background:radial-gradient(closest-side,rgba(58,160,219,.28),transparent);opacity:0;pointer-events:none;animation:fade 2.4s .15s ease-in-out infinite alternate}
.splash-top-hud{position:absolute;top:clamp(18px,3.2vw,36px);font-size:10.5px;font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace;
  letter-spacing:.22em;text-transform:uppercase;color:rgba(143,212,255,.72);opacity:0;transform:translate3d(0,-8px,0);animation:topHud .6s .1s cubic-bezier(.16,1,.3,1) forwards}
.splash-top-l{left:clamp(20px,4vw,56px)}.splash-top-r{right:clamp(20px,4vw,56px);text-align:right}

/* wordmark: line-mask upward reveal (lorenzolottici.it style) */
.wordwrap{position:relative;will-change:transform,opacity}
.word{display:flex;overflow:hidden;padding:.06em .04em;font-size:clamp(44px,9.5vw,124px);font-weight:700;letter-spacing:-.03em;line-height:1.08}
.l{display:inline-block;opacity:0;color:transparent;background:linear-gradient(180deg,#fff 38%,#8fd4ff 100%);-webkit-background-clip:text;background-clip:text;
  transform:translate3d(0,112%,0);will-change:transform,opacity;backface-visibility:hidden;
  animation:assemble 1.05s cubic-bezier(.16,1,.3,1) forwards;animation-delay:calc(var(--i)*.038s + .08s)}
.sp{width:.28em}
.refl{position:absolute;left:0;top:100%;margin-top:-.16em;transform:scaleY(-1);opacity:.22;pointer-events:none;
  -webkit-mask-image:linear-gradient(transparent 48%,#000);mask-image:linear-gradient(transparent 48%,#000)}

.rule{position:relative;height:1.5px;width:min(60vw,440px);margin:30px 0 20px;background:linear-gradient(90deg,transparent,#3aa0db,#8fd4ff,#fff,#8fd4ff,#3aa0db,transparent);
  transform:scaleX(0);opacity:0;will-change:transform,opacity;animation:rule 1.1s .75s cubic-bezier(.16,1,.3,1) forwards}
.rule::after{content:"";position:absolute;top:-2.25px;left:0;width:6px;height:6px;border-radius:50%;background:#fff;box-shadow:0 0 12px 3px #72c5f8;
  opacity:0;animation:dot 2.4s 1.65s ease-in-out infinite}
.sub-mask{overflow:hidden;padding:2px 0}
.sub{font-size:clamp(11px,1.5vw,16px);font-weight:300;text-transform:uppercase;color:#9fd2f5;text-align:center;letter-spacing:.38em;padding:0 0 0 .38em;
  opacity:0;transform:translate3d(0,110%,0);will-change:transform,opacity;animation:sub 1s .92s cubic-bezier(.16,1,.3,1) forwards}

.hud{position:absolute;bottom:clamp(18px,3.5vw,40px);font-size:11.5px;letter-spacing:.16em;text-transform:uppercase;color:#8fbbe6;font-variant-numeric:tabular-nums}
.hl{left:clamp(20px,4vw,56px)}.hr{right:clamp(20px,4vw,56px);text-align:right}
.hr b{display:block;font-weight:200;font-size:clamp(34px,5vw,64px);letter-spacing:-.02em;line-height:1;color:#fff}
.bar{position:absolute;left:0;bottom:0;height:3px;width:100%;transform-origin:left center;transform:scaleX(0);
  background:linear-gradient(90deg,#1b5c9e,#3aa0db,#72c5f8,#fff);box-shadow:0 0 16px rgba(114,197,248,.65);will-change:transform}

.leaving{clip-path:inset(0 0 100% 0);pointer-events:none}
.leaving .wordwrap{animation:through .78s cubic-bezier(.76,0,.24,1) forwards}
.leaving .rule,.leaving .sub,.leaving .hud,.leaving .splash-top-hud{opacity:0;transform:translate3d(0,-14px,0);animation:none;transition:opacity .35s ease,transform .45s cubic-bezier(.16,1,.3,1)}

@keyframes assemble{0%{opacity:0;transform:translate3d(0,112%,0)}35%{opacity:1}100%{opacity:1;transform:translate3d(0,0,0)}}
@keyframes through{to{transform:translate3d(0,-28px,0) scale(.97);opacity:0}}
@keyframes rule{from{transform:scaleX(0);opacity:0}to{transform:scaleX(1);opacity:1}}
@keyframes dot{0%{transform:translateX(0);opacity:0}15%{opacity:1}85%{opacity:1}100%{transform:translateX(min(60vw,434px));opacity:0}}
@keyframes sub{from{opacity:0;transform:translate3d(0,110%,0)}to{opacity:1;transform:translate3d(0,0,0)}}
@keyframes topHud{to{opacity:1;transform:translate3d(0,0,0)}}
@keyframes fade{from{opacity:.45}to{opacity:1}}
@media (prefers-reduced-motion:reduce){.l,.rule,.sub,.splash-top-hud{animation:none;opacity:1;transform:none}.wordwrap,.halo{animation:none}}
</style>
</head>
<body>
<main class="splash" id="splash" role="status" aria-label="Loading MediQ Pharma">
  <div class="halo"></div>
  <div class="wordwrap" aria-hidden="true"><div class="word" id="word"></div></div>
  <div class="rule"></div>
  <div class="sub-mask"><div class="sub">Medical Supplies Distribution</div></div>
  <div class="hud hr"><b id="num">000</b></div>
  <div class="bar" id="bar"></div>
</main>

<script>
(function(){
  var TARGET='index.html';
  var DURATION=3000;
  var TEXT='MediQ Pharma';
  var splash=document.getElementById('splash'), bar=document.getElementById('bar'), num=document.getElementById('num'),
      word=document.getElementById('word'), t0=0, go=false;

  for(var i=0;i<TEXT.length;i++){
    var s=document.createElement('span');
    if(TEXT[i]===' '){s.className='sp';}
    else{
      s.className='l'; s.textContent=TEXT[i]; s.style.setProperty('--i',i);
    }
    word.appendChild(s);
  }
  var refl=word.cloneNode(true); refl.removeAttribute('id'); refl.className='word refl'; word.parentNode.appendChild(refl);

  function leave(){
    if(go)return; go=true;
    splash.classList.add('leaving');
    setTimeout(function(){location.replace(TARGET)},800);
  }
  function tick(now){
    if(!t0)t0=now;
    var p=Math.min(1,(now-t0)/DURATION), e=1-Math.pow(1-p,2.6);
    bar.style.transform='scaleX('+p.toFixed(4)+')';
    num.textContent=String(Math.round(e*100)).padStart(3,'0');
    if(p>=1&&!go){leave()}
    if(!go)requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
  addEventListener('keydown',function(e){if(e.key==='Escape')leave()});
})();
</script>
</body>
</html>
