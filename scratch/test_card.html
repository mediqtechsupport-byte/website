<!DOCTYPE html>
<html>
<head>
<style>
.card {
  position: relative;
  width: 320px;
  background: #0c162d;
  border: 1px solid rgba(255,255,255,0.1);
  border-radius: 28px;
  padding: 12px;
  font-family: sans-serif;
  color: white;
}
.img-wrap {
  position: relative;
  width: 100%;
  height: 180px;
  border-radius: 20px;
  overflow: hidden;
  background: #1a2846;
}
.img-wrap img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}
.notch {
  position: absolute;
  bottom: 0;
  right: 0;
  width: 64px;
  height: 64px;
  background: #0c162d;
  border-top-left-radius: 24px;
  display: flex;
  align-items: center;
  justify-content: center;
}
.fillet-top {
  position: absolute;
  bottom: 64px;
  right: 0;
  width: 20px;
  height: 20px;
  border-bottom-right-radius: 20px;
  box-shadow: 6px 6px 0 6px #0c162d;
  pointer-events: none;
}
.fillet-left {
  position: absolute;
  bottom: 0;
  right: 64px;
  width: 20px;
  height: 20px;
  border-bottom-right-radius: 20px;
  box-shadow: 6px 6px 0 6px #0c162d;
  pointer-events: none;
}
.btn-circle {
  width: 46px;
  height: 46px;
  border-radius: 50%;
  background: #3aa0db;
  color: #07132b;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  transition: transform 0.2s, background 0.2s;
}
.btn-circle:hover {
  transform: scale(1.08);
  background: #72c5f8;
}
</style>
</head>
<body style="background: #07132b; padding: 40px;">
  <div class="card">
    <div class="img-wrap">
      <div style="width:100%;height:100%;background:linear-gradient(135deg, #1e3a6a, #0b1c3d);"></div>
      <div class="fillet-top"></div>
      <div class="fillet-left"></div>
      <div class="notch">
        <div class="btn-circle">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M7 17L17 7M17 7H7M17 7V17"/></svg>
        </div>
      </div>
    </div>
    <div style="padding: 16px 8px 8px;">
      <h3 style="margin:0 0 6px; font-size:18px;">Intraocular Lenses</h3>
      <p style="margin:0 0 12px; font-size:13px; color:#94a3b8; line-height:1.4;">RayOne® Galaxy spiral AI, EMV extended visual range, trifocal, and monofocal precision IOLs.</p>
      <div style="display:flex; gap:6px;">
        <span style="font-size:10px; font-weight:bold; padding:4px 8px; border-radius:6px; background:rgba(255,255,255,0.06); color:#cbd5e1;">SURGICAL OPTICS</span>
        <span style="font-size:10px; font-weight:bold; padding:4px 8px; border-radius:6px; background:rgba(255,255,255,0.06); color:#cbd5e1;">PRELOADED</span>
      </div>
    </div>
  </div>
</body>
</html>
