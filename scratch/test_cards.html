<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Test 21st.dev Style 3 Cards</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .cutout-top {
      position: absolute; top: -20px; right: 0; width: 20px; height: 20px;
      border-bottom-right-radius: 20px; box-shadow: 6px 6px 0 0 #071530;
    }
    .cutout-left {
      position: absolute; bottom: 0; left: -20px; width: 20px; height: 20px;
      border-bottom-right-radius: 20px; box-shadow: 6px 6px 0 0 #071530;
    }
  </style>
</head>
<body class="bg-[#050e1f] text-white p-10 font-sans">
  <div class="max-w-7xl mx-auto grid grid-cols-1 md:grid-cols-3 gap-8">
    
    <!-- CARD 1: What We Do -->
    <div class="group relative rounded-[32px] bg-[#071530] border border-sky/25 p-3.5 pb-7 shadow-2xl transition-all duration-300 hover:border-sky/50 hover:-translate-y-1.5 flex flex-col justify-between">
      <div>
        <!-- Top Image Container with Cutout -->
        <div class="relative w-full aspect-[4/3] rounded-[24px] overflow-hidden bg-black/40">
          <img src="assets/img/pillars/p1_cleanroom_inspect.jpg" alt="What We Do" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-700">
          
          <div class="absolute top-3.5 right-3.5 px-3 py-1 rounded-full bg-black/60 backdrop-blur-md border border-white/15 text-[11px] font-mono font-bold text-white tracking-wider">
            6 CAPABILITIES
          </div>

          <!-- Cutout block -->
          <div class="absolute bottom-0 right-0 w-[68px] h-[68px] bg-[#071530] rounded-tl-[24px]">
            <div class="cutout-top"></div>
            <div class="cutout-left"></div>
          </div>

          <!-- Arrow Button -->
          <button type="button" class="absolute bottom-1.5 right-1.5 size-13 rounded-full bg-[#0d2247] border border-sky/35 text-sky group-hover:bg-sky group-hover:text-[#071530] flex items-center justify-center transition-all duration-300 shadow-xl cursor-pointer">
            <svg class="size-5 transition-transform duration-300 group-hover:translate-x-0.5 group-hover:-translate-y-0.5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.3" d="M7 17L17 7M17 7H9M17 7V15" />
            </svg>
          </button>
        </div>

        <!-- Content -->
        <div class="px-3 pt-5">
          <h3 class="text-2xl font-extrabold text-white tracking-tight mb-2 group-hover:text-sky transition-colors">
            What We Do
          </h3>
          <p class="text-sm text-gray-300 leading-relaxed line-clamp-3">
            Comprehensive commercial operations, clinical distribution, and surgical healthcare partnerships across the Philippine archipelago.
          </p>
        </div>
      </div>

      <!-- Tags -->
      <div class="px-3 pt-5 flex flex-wrap gap-2">
        <span class="px-2.5 py-1 rounded-md bg-white/5 border border-white/10 text-[10px] font-mono font-bold tracking-wider uppercase text-sky/90">SUPPLY CHAIN</span>
        <span class="px-2.5 py-1 rounded-md bg-white/5 border border-white/10 text-[10px] font-mono font-bold tracking-wider uppercase text-sky/90">COMMERCIAL</span>
        <span class="px-2.5 py-1 rounded-md bg-white/5 border border-white/10 text-[10px] font-mono font-bold tracking-wider uppercase text-sky/90">EDUCATION</span>
      </div>
    </div>

  </div>
</body>
</html>
