<!DOCTYPE html>
<html>
<head>
  <style>
    body { background: #07132b; color: white; font-family: sans-serif; padding: 40px; display: flex; gap: 30px; }
    .card {
      width: 320px;
      background: #0d1e3d;
      border: 1px solid rgba(58, 160, 219, 0.2);
      border-radius: 28px;
      padding: 14px;
      position: relative;
    }
    .img-box {
      position: relative;
      width: 100%;
      height: 200px;
      border-radius: 20px;
      overflow: hidden;
      background: #152b54;
    }
    .img-box img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .badge {
      position: absolute;
      top: 12px;
      right: 12px;
      padding: 3px 10px;
      border-radius: 9999px;
      background: rgba(0,0,0,0.45);
      backdrop-filter: blur(8px);
      font-size: 11px;
      font-weight: 700;
      color: rgba(255,255,255,0.85);
      border: 1px solid rgba(255,255,255,0.1);
    }
    /* Cutout corner */
    .notch-svg {
      position: absolute;
      bottom: -1px;
      right: -1px;
      width: 88px;
      height: 88px;
      fill: #0d1e3d; /* matches card bg */
      pointer-events: none;
    }
    .btn-action {
      position: absolute;
      bottom: 6px;
      right: 6px;
      width: 52px;
      height: 52px;
      border-radius: 50%;
      background: #3aa0db;
      color: #07132b;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(0,0,0,0.3);
      transition: all 0.25s ease;
      z-index: 10;
    }
    .btn-action:hover {
      background: #72c5f8;
      transform: scale(1.06);
    }
    .btn-action svg {
      width: 22px;
      height: 22px;
      stroke-width: 2.5;
      transition: transform 0.25s ease;
    }
    .card:hover .btn-action svg {
      transform: translate(2px, -2px);
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="img-box">
      <img src="https://images.unsplash.com/photo-1579684385127-1ef15d508118?auto=format&fit=crop&w=600&q=80" alt="demo">
      <div class="badge">2026</div>

      <!-- Cutout SVG that creates the smooth double inverse fillet -->
      <svg class="notch-svg" viewBox="0 0 88 88">
        <path d="M 88,0 
                 C 88,14 74,24 60,24 
                 C 40,24 24,40 24,60 
                 C 24,74 14,88 0,88 
                 L 88,88 Z" />
      </svg>

      <!-- Circular Arrow Button -->
      <div class="btn-action">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
          <path d="M7 17L17 7M17 7H7M17 7V17" />
        </svg>
      </div>
    </div>

    <div style="padding: 18px 8px 6px;">
      <h3 style="margin: 0 0 6px; font-size: 19px; font-weight: 700; color: #ffffff;">Intraocular Lenses</h3>
      <p style="margin: 0 0 14px; font-size: 13.5px; color: rgba(246,242,234,0.72); line-height: 1.5;">
        RayOne® Galaxy spiral AI, EMV extended visual range, trifocal, and monofocal precision IOLs.
      </p>
      <div style="display: flex; gap: 6px;">
        <span style="font-size: 10px; font-weight: 700; padding: 4px 8px; border-radius: 6px; background: rgba(255,255,255,0.06); color: #cbd5e1; letter-spacing: 0.05em;">SURGICAL OPTICS</span>
        <span style="font-size: 10px; font-weight: 700; padding: 4px 8px; border-radius: 6px; background: rgba(255,255,255,0.06); color: #cbd5e1; letter-spacing: 0.05em;">PRELOADED</span>
      </div>
    </div>
  </div>
</body>
</html>
